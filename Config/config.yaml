model:
  target: Models.interpretable_diffusion.gaussian_diffusion.Diffusion_TS
  params:
    seq_length: 2048  # 160
    feature_size: 3
    n_layer_enc: 1
    n_layer_dec: 2
    d_model: 64  # 4 X 16
    timesteps: 200
    sampling_timesteps: 200
    loss_type: 'l1'
    beta_schedule: 'cosine'
    n_heads: 4
    mlp_hidden_times: 4
    attn_pd: 0.1
    resid_pd: 0.1
    kernel_size: 5
    padding_size: 2

solver:

  base_lr: 1.0e-5
  max_epochs: 200000
  results_folder: ./Checkpoints/Checkpoints_syn
  gradient_accumulate_every: 2
  save_cycle: 5000  # max_epochs // 10
  ema:
    decay: 0.99
    update_interval: 10
  
  scheduler:
    target: engine.lr_sch.ReduceLROnPlateauWithWarmup
    params:
      factor: 0.5
      patience: 200
      min_lr: 1.0e-5
      threshold: 1.0e-1
      threshold_mode: rel
      warmup_lr: 8.0e-4
      warmup: 100 
      verbose: False


dataloader:
  train_dataset:
    target: Utils.Data_utils.real_datasets.CustomDataset
    params:
      name: 'Leak'
      data_root: /mnt/tj/projects/Diffusion-TS-main/Data/leak_signals/3/2/merged_samples_10.csv
      # output_dir: ../Data/output
      window: 2048
      # use_cols: [1,3,5]
      seed: 123
      
      save2npy: True
      neg_one_to_one: True
      period: train

  test_dataset:
    target: Utils.Data_utils.real_datasets.CustomDataset
    params:
      name: 'Leak'
      proportion: 0.9  # rate
      data_root: /mnt/tj/projects/Diffusion-TS-main/Data/leak_signals/3/2/merged_samples_10.csv
      window: 2048  # seq_length
      save2npy: True
      neg_one_to_one: True
      seed: 123
      period: test
      style: separate
      distribution: geometric
    coefficient: 1.0e-2
    step_size: 1.0e-1  #5.0e-2
    sampling_steps: 500

  batch_size: 16
  sample_size: 16
  shuffle: False


