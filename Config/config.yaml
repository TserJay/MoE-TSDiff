model:
  target: Models.interpretable_diffusion.gaussian_diffusion.Diffusion_TS
  params:
    seq_length: 1780
    feature_size: 3
    
    num_major_classes: 4       # 4 个大类
    num_sub_classes: 12        # 12 个小类
    
    # 模型架构参数 - 平衡优化方案
    n_layer_enc: 4  # 从 3 增加到 4，提高特征提取能力
    n_layer_dec: 3  # 保持不变
    d_model: 96  # 从 64 增加到 96，提高模型容量（增加 50%）
    timesteps: 1000
    sampling_timesteps: 500
    loss_type: 'l1'
    beta_schedule: 'cosine'
    n_heads: 4  # 从 2 增加到 4，与 d_model=96 匹配（96/4=24）
    mlp_hidden_times: 4
    attn_pd: 0.2
    resid_pd: 0.2
    kernel_size: 5
    padding_size: 2

    # 傅里叶损失参数 - 保持高权重以确保特征学习
    use_ff: True
    reg_weight: 4.0  # 保持较高傅里叶权重，确保频域特征

solver:
  # 优化器和训练参数 - 平衡优化方案
  base_lr: 5.0e-4  # 从 1.0e-4 增加到 5.0e-4，提高训练速度
  max_epochs: 20000  # 从 60000 降低到 20000，减少训练时间
  results_folder: ./Checkpoints/Checkpoints_20260304
  gradient_accumulate_every: 2  # 从 4 降低到 2，减少梯度累积
  save_cycle: 2000  # 从 1000 增加到 2000，减少保存频率
  use_amp: False  # 是否使用混合精度训练
  ema:
    decay: 0.995  # 从 0.999 降低到 0.995，更灵活
    update_interval: 5  # 从 1 增加到 5，减少更新频率
  
  scheduler:
    target: engine.lr_sch.ReduceLROnPlateauWithWarmup
    params:
      factor: 0.5  # 学习率衰减因子
      patience: 200  # 从 500 降低到 200，更快速响应
      min_lr: 1.0e-5
      threshold: 1.0e-2
      threshold_mode: rel
      warmup_lr: 5.0e-5  # 从 1.0e-4 降低到 5.0e-5，更温和的warmup
      warmup: 500  # 从 1000 降低到 500，更短 warmup
      verbose: False


dataloader:
  train_dataset:
    target: Utils.Data_utils.real_datasets.HierarchicalLabelDataset
    params:
      name: 'Leak'
      data_root: Data/leak_signals
      output_dir: ./Data/output
      window: 1780
      proportion: 0.8
      use_cols: [1, 3, 5]  # 使用第2、4、6列
      num_major_classes: 4  # 4个大类
      num_sub_classes: 12  # 12个小类
      seed: 123
      
      save2npy: True
      neg_one_to_one: True
      period: train

  test_dataset:
    target: Utils.Data_utils.real_datasets.HierarchicalLabelDataset
    params:
      name: 'Leak'
      data_root: Data/leak_signals
      output_dir: ./Data/output
      window: 1780
      proportion: 0.2
      use_cols: [1, 3, 5]
      num_major_classes: 4
      num_sub_classes: 12
      save2npy: True
      neg_one_to_one: True
      seed: 123
      period: test

  coefficient: 0.01
  step_size: 0.1
  sampling_steps: 250  # 与sampling_timesteps一致

  batch_size: 8  # 从 16 降低到 8，减小显存占用
  sample_size: 8
  shuffle: True
  num_workers: 0  # 单进程数据加载，避免内存错误
