model:
  target: Models.interpretable_diffusion.gaussian_diffusion.Diffusion_TS
  params:
    seq_length: 1780
    feature_size: 3
    
    num_major_classes: 4       # 4 个大类
    num_sub_classes: 12        # 12 个小类
    
    # 模型架构参数 - 平衡优化方案
    n_layer_enc: 4  # 从 3 增加到 4，提高特征提取能力
    n_layer_dec: 3  # 保持不变
    d_model: 96  # 从 64 增加到 96，提高模型容量（增加 50%）
    timesteps: 1000
    sampling_timesteps: 500
    loss_type: 'l1'
    beta_schedule: 'cosine'
    n_heads: 4  # 从 2 增加到 4，与 d_model=96 匹配（96/4=24）
    mlp_hidden_times: 4
    attn_pd: 0.2
    resid_pd: 0.2
    kernel_size: 5
    padding_size: 2

    # 傅里叶损失参数 - 进一步优化
    use_ff: True
    reg_weight: 0.3  # 从 0.5 降低到 0.3，进一步减少周期性波动

solver:
  # 优化器和训练参数 - 平衡优化方案
  base_lr: 1.5e-4  # 从 2.0e-4 降低到 1.5e-4，更稳定
  max_epochs: 50000  # 从 50000 增加到 60000，提高训练效果
  results_folder: ./Checkpoints/20260302_optimized
  gradient_accumulate_every: 1  # 从 8 增加到 16，配合更小的 batch_size
  save_cycle: 2000  # 从 5000 降低到 2000，更频繁保存
  use_amp: True  # 是否使用混合精度训练
  ema:
    decay: 0.9995  # 从 0.999 增加到 0.9995，更平滑
    update_interval: 1  # 从 5 降低到 1，每步更新
  
  scheduler:
    target: engine.lr_sch.ReduceLROnPlateauWithWarmup
    params:
      factor: 0.5  # 学习率衰减因子
      patience: 200  # 从 100 增加到 200，更耐心
      min_lr: 1.0e-5
      threshold: 1.0e-2
      threshold_mode: rel
      warmup_lr: 7.5e-5  # 从 1.0e-4 降低到 7.5e-5
      warmup: 500  # 从 200 增加到 500，更长 warmup
      verbose: False


dataloader:
  train_dataset:
    target: Utils.Data_utils.real_datasets.HierarchicalLabelDataset
    params:
      name: 'Leak'
      data_root: Data/leak_signals
      output_dir: ./Data/output
      window: 1780
      proportion: 0.8
      use_cols: [1, 3, 5]  # 使用第2、4、6列
      num_major_classes: 4  # 4个大类
      num_sub_classes: 12  # 12个小类
      seed: 123
      
      save2npy: True
      neg_one_to_one: True
      period: train

  test_dataset:
    target: Utils.Data_utils.real_datasets.HierarchicalLabelDataset
    params:
      name: 'Leak'
      data_root: Data/leak_signals
      output_dir: ./Data/output
      window: 1780
      proportion: 0.2
      use_cols: [1, 3, 5]
      num_major_classes: 4
      num_sub_classes: 12
      save2npy: True
      neg_one_to_one: True
      seed: 123
      period: test

  coefficient: 1.0e-2
  step_size: 1.0e-1
  sampling_steps: 500  # 与sampling_timesteps一致

  batch_size: 16  # 从 32 降低到 16，减小显存占用
  sample_size: 16
  shuffle: True
  num_workers: 0  # 单进程数据加载，避免内存错误
